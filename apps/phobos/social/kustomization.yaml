---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/social
  - resources/persistentvolume.yaml
  - resources/persistentvolumeclaim.yaml

secretGenerator:
  - envs:
      - configs/pds.env
    name: pds-env
    namespace: social

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - nick.social.osborn.io
          - social.osborn.io
    target:
      kind: Certificate
      name: social
      namespace: social
  - patch: |-
      - op: replace
        path: /spec/hostnames
        value:
          - social.osborn.io
          - nick.social.osborn.io
    target:
      kind: HTTPRoute
      name: social
      namespace: social
