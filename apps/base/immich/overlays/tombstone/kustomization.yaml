---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      - op: add
        path: /metadata/annotations
        value:
          link.argocd.argoproj.io/external-link: https://immich.***REMOVED***
    target:
      kind: Deployment
      name: immich-server
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - immich.***REMOVED***
    target:
      kind: HTTPRoute
