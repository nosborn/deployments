---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/name: gitea-data
  name: gitea-data
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 100Gi
  claimRef:
    name: gitea-data
    namespace: gitea
  iscsi:
    fsType: btrfs
    iqn: iqn.2000-01.com.synology:diskstation.default-target.8f20388e135
    lun: 18
    targetPortal: 192.168.1.3:3260
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
