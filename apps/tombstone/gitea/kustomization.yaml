---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/gitea
  - resources/sopssecret.yaml

configMapGenerator:
  - behavior: merge
    envs:
      - configs/gitea-app-ini.env
    name: gitea-app-ini-env
    namespace: gitea

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - git.home.arpa
    target:
      kind: Certificate
      name: gitea
      namespace: gitea
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`git.home.arpa`)
    target:
      kind: IngressRoute
      name: gitea
      namespace: gitea
