---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/vaultwarden
  - resources/persistentvolume.yaml
  - resources/persistentvolumeclaim.yaml

secretGenerator:
  - behavior: merge
    files:
      - configs/vaultwarden.env
    name: vaultwarden-env
    namespace: vaultwarden

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - passwords.home.arpa
    target:
      kind: Certificate
      name: vaultwarden
      namespace: vaultwarden
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`passwords.home.arpa`)
    target:
      kind: IngressRoute
      name: vaultwarden
      namespace: vaultwarden
