---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hook
  namespace: flux-system
spec:
  hostnames:
    - flux.osborn.io
  parentRefs:
    - name: phobos-gateway
      namespace: traefik
  rules:
    - backendRefs:
        - name: notification-controller
          port: 80
      filters:
        - extensionRef:
            group: traefik.io
            kind: Middleware
            name: hook-ip-allowlist
          type: ExtensionRef
      matches:
        - path:
            type: PathPrefix
            value: /hook/
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-cert
  namespace: flux-system
spec:
  from:
    - group: ""
      kind: Gateway
      namespace: traefik
  to:
    - group: ""
      kind: Secret
      name: hook-tls
