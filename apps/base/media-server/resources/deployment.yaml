---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: recyclarr
    app.kubernetes.io/instance: media-server
    app.kubernetes.io/name: recyclarr
  name: recyclarr
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: recyclarr
      app.kubernetes.io/instance: media-server
      app.kubernetes.io/name: recyclarr
  # strategy:
  #   type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: recyclarr
        app.kubernetes.io/instance: media-server
        app.kubernetes.io/name: recyclarr
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: recyclarr-env
          image: ghcr.io/recyclarr/recyclarr:latest
          imagePullPolicy: Always
          # livenessProbe:
          #   failureThreshold: 3
          #   httpGet:
          #     path: /ping
          #     port: http
          #   periodSeconds: 10
          #   successThreshold: 1
          #   timeoutSeconds: 1
          name: recyclarr
          # ports:
          #   - containerPort: 8989
          #     name: http
          # readinessProbe:
          #   failureThreshold: 3
          #   httpGet:
          #     path: /ping
          #     port: http
          #   periodSeconds: 10
          #   successThreshold: 1
          #   timeoutSeconds: 1
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /tmp
              name: temp
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          secret:
            secretName: recyclarr-config
        - emptyDir: {}
          name: temp
