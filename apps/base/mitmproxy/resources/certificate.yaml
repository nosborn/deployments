---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mitmproxy
  namespace: mitmproxy
spec:
  dnsNames: []
  duration: 168h
  issuerRef:
    kind: ClusterIssuer
    name: ownca
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 8h
  secretName: mitmproxy-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mitmweb
  namespace: mitmproxy
spec:
  dnsNames: []
  duration: 168h
  issuerRef:
    kind: ClusterIssuer
    name: ownca
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 8h
  secretName: mitmweb-tls
