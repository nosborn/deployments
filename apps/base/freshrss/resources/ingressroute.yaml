---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app.kubernetes.io/instance: freshrss
    app.kubernetes.io/name: freshrss
  name: freshrss
  namespace: freshrss
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`rss.example.com`)
      middlewares:
        - name: ip-allowlist
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: freshrss
          port: 80
  tls:
    secretName: freshrss-tls
