---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: llama-cpp
  namespace: llama-cpp
spec:
  dnsNames:
    - llama.example.com
  duration: 168h
  issuerRef:
    kind: ClusterIssuer
    name: ownca
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 8h
  secretName: llama-cpp-tls
