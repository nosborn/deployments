---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: redirector
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: ft-tls
          # - name: google-tls
          - name: instagram-tls
          - name: mandrillapp-tls
          - name: medium-tls
          - name: reddit-tls
          - name: skimresources-tls
          - name: tiktok-tls
          - name: twitter-tls
          - name: youtube-tls
