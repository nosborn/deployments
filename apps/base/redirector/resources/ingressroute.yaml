# yamllint disable rule:line-length
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redirector
  namespace: redirector
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`www.ft.com`)
      middlewares:
        - name: ip-allowlist
      services:
        - name: redirector
          port: 80
    - kind: Rule
      match: Host(`www.google.com`)
      middlewares:
        - name: ip-allowlist
      services:
        - name: redirector
          port: 80
  tls:
    secretName: redirector-tls
