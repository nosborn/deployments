---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/openclaw
  - resources/persistentvolume.yaml
  - resources/persistentvolumeclaim.yaml

secretGenerator:
  - files:
      - AGENTS.md=configs/AGENTS.md
      - OwnCA_Root.crt=configs/OwnCA_Root.crt
      - openclaw.json=configs/openclaw.json
    name: openclaw-config
    namespace: openclaw

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - claw.home.arpa
    target:
      kind: Certificate
      name: openclaw
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/certs/OwnCA_Root.pem
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          mountPath: /etc/ssl/certs/OwnCA_Root.pem
          name: config
          subPath: OwnCA_Root.crt
    target:
      kind: Deployment
      name: openclaw
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`claw.home.arpa`)
    target:
      kind: IngressRoute
      name: openclaw
