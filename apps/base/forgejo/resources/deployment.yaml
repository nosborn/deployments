      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - configMap:
            defaultMode: 365
            name: forgejo-init
          name: init
        - emptyDir: {}
          name: temp
