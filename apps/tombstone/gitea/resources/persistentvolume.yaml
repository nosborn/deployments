---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/name: gitea-data
  name: gitea-data
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 100Gi
  claimRef:
    name: gitea-data
    namespace: gitea
  iscsi:
    fsType: btrfs
    iqn: ***REMOVED***
    lun: 2
    targetPortal: ***REMOVED***
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
