---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: instagram
  namespace: redirector
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`instagram.com`) || Host(`www.instagram.com`)
      middlewares:
        - name: ip-allowlist
      services:
        - name: redirector
          port: 80
  tls:
    secretName: instagram-tls
---
