---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: search
  namespace: search
spec:
  hostnames:
    - search.example.com # patched in overlay
  parentRefs:
    - name: gateway
  rules:
    - backendRefs:
        - name: search
          port: 80
      filters:
        - extensionRef:
            group: traefik.io
            kind: Middleware
            name: ip-allowlist
          type: ExtensionRef
      matches:
        - path:
            type: PathPrefix
            value: /
