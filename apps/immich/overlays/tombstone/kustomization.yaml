---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - resources/sopssecret.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - immich.***REMOVED***
    target:
      kind: Certificate
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - immich.***REMOVED***
    target:
      kind: HTTPRoute
