---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app.kubernetes.io/name: login
  name: login
  namespace: login
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`login.example.com`)
      middlewares:
        - name: ip-allowlist
        - name: security-headers
      services:
        - name: login
          port: 80
  tls:
    secretName: login-tls
