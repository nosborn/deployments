# yamllint disable rule:line-length
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  dnsNames:
    - traefik.${DOMAIN_NAME}
  issuerRef:
    kind: ClusterIssuer
    name: ownca
  secretName: traefik-dashboard-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ip-allowlist
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - ${LAN_IPV4_SUBNET}
      - ${VPN_IPV4_SUBNET}
      - ${LAN_IPV6_SUBNET}
      - ${VPN_IPV6_SUBNET}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      Permissions-Policy: geolocation=(), interest-cohort=(), microphone=(), camera=()
      Referrer-Policy: strict-origin-when-cross-origin
      X-Content-Type-Options: nosniff
      X-Frame-Options: DENY
      X-Robots-Tag: noindex, nofollow
      X-XSS-Protection: 1; mode=block
