---
exporters:
  otlp/uptrace:
    endpoint: https://api.uptrace.dev:4317
    headers:
      uptrace-dsn: ${env:UPTRACE_DSN}
    tls:
      insecure: false
extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
processors:
  batch:
    send_batch_size: 10000
    timeout: 30s
  cumulativetodelta: {}
  k8sattributes:
    extract:
      metadata:
        - container.image.name
        - container.image.tag
        - k8s.cluster.uid
        - k8s.container.name
        - k8s.cronjob.name
        - k8s.daemonset.name
        - k8s.daemonset.uid
        - k8s.deployment.name
        - k8s.job.name
        - k8s.job.uid
        - k8s.namespace.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.pod.start_time
        - k8s.pod.uid
        - k8s.replicaset.name
        - k8s.replicaset.uid
        - k8s.statefulset.name
        - k8s.statefulset.uid
        - service.instance.id
        - service.name
        - service.namespace
        - service.version
      otel_annotations: true
    filter:
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/node_hostname:
    attributes:
      - key: host.name
        value: ${env:OTEL_K8S_NODE_NAME}
        action: upsert
receivers:
  hostmetrics:
    collection_interval: 60s
    root_path: /hostfs
    scrapers:
      cpu: null
      disk: null
      filesystem:
        exclude_fs_types:
          fs_types:
            - autofs
            - binfmt_misc
            - bpf
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - fusectl
            - hugetlbfs
            - iso9660
            - mqueue
            - nsfs
            - overlay
            - proc
            - procfs
            - pstore
            - rpc_pipefs
            - securityfs
            - selinuxfs
            - squashfs
            - sysfs
            - tracefs
          match_type: strict
        exclude_mount_points:
          match_type: regexp
          mount_points:
            - /dev/*
            - /proc/*
            - /run/k3s/containerd/*
            - /snap/*
            - /sys/*
            - /var/lib/docker/*
            - /var/lib/kubelet/*
      load: null
      memory: null
      network: null
  kubeletstats:
    auth_type: serviceAccount
    collection_interval: 60s
    endpoint: ${env:K8S_NODE_IP}:10250
  otlp:
    protocols:
      grpc:
        endpoint: ${env:MY_POD_IP}:4317
      http:
        endpoint: ${env:MY_POD_IP}:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: opentelemetry-collector
          scrape_interval: 60s
          static_configs:
            - targets:
                - ${env:MY_POD_IP}:8888
        - job_name: dcgm-exporter
          scrape_interval: 60s
          kubernetes_sd_configs:
            - role: pod
              selectors:
                - role: pod
                  field: spec.nodeName=${env:K8S_NODE_NAME}
          relabel_configs:
            - source_labels:
                - __meta_kubernetes_namespace
              action: keep
              regex: dcgm-exporter
            - source_labels:
                - __meta_kubernetes_pod_label_app_kubernetes_io_name
              action: keep
              regex: dcgm-exporter
            - source_labels:
                - __meta_kubernetes_pod_container_port_number
              action: keep
              regex: "9400"
service:
  extensions:
    - health_check
  pipelines:
    logs:
      exporters:
        - otlp/uptrace
      processors:
        - memory_limiter
        - k8sattributes
        - batch
      receivers:
        - otlp
    metrics:
      exporters:
        - otlp/uptrace
      processors:
        - memory_limiter
        - k8sattributes
        - cumulativetodelta
        - batch
      receivers:
        - otlp
        - prometheus
        - kubeletstats
    metrics/host:
      exporters:
        - otlp/uptrace
      processors:
        - memory_limiter
        - cumulativetodelta
        - resource/node_hostname
        - batch
      receivers:
        - hostmetrics
    traces:
      exporters:
        - otlp/uptrace
      processors:
        - memory_limiter
        - k8sattributes
        - batch
      receivers:
        - otlp
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:MY_POD_IP}
                port: 8888
    resource:
      host.name: ${env:OTEL_K8S_NODE_NAME}
      k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
      k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
      k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
      k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
      k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
