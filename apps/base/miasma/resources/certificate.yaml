---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: miasma
  namespace: miasma
spec:
  dnsNames:
    - miasma.example.com
  duration: 168h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging # FIXME: letsencrypt
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 8h
  secretName: miasma-tls
