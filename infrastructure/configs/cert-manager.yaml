# yamllint disable rule:line-length
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    # email: TODO?
    privateKeySecretRef:
      name: letsencrypt-account-key
    profile: shortlived
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: gateway
                namespace: traefik
        # selector: -- TODO?
        #   dnsZones:
        #     - example.com # FIXME
        waitInsteadOfSelfCheck: 30s
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # email: TODO?
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    profile: shortlived
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: gateway
                namespace: traefik
        # selector: -- TODO?
        #   dnsZones:
        #     - example.com # FIXME
        waitInsteadOfSelfCheck: 30s
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ownca
spec:
  ca:
    secretName: ownca-intermediate-ca
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
