---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app: openclaw
  name: openclaw-data
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  claimRef:
    name: openclaw-data
    namespace: openclaw
  iscsi:
    fsType: btrfs
    iqn: iqn.2000-01.com.synology:diskstation.default-target.8f20388e135
    lun: 3
    targetPortal: 192.168.1.3:3260
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
