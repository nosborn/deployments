          #   failureThreshold: 3
          #   httpGet:
          #     path: /ping
          #     port: http
          #   periodSeconds: 10
          #   successThreshold: 1
          #   timeoutSeconds: 1
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /tmp
              name: temp
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          secret:
            secretName: recyclarr-config
        - emptyDir: {}
          name: temp
