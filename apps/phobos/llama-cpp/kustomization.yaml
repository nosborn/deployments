---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/llama-cpp

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - llama.home.arpa
    target:
      kind: Certificate
      name: llama-cpp
      namespace: llama-cpp
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`llama.home.arpa`)
    target:
      kind: IngressRoute
      name: llama-cpp
      namespace: llama-cpp
