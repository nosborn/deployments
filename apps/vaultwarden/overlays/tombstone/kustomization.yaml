---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vaultwarden

resources:
  - ../../base
  - resources/sopssecret.yaml

configMapGenerator:
  - behavior: merge
    literals:
      - DOMAIN=https://passwords.***REMOVED***
    name: vaultwarden

patches:
  - patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: ownca
          traefik.ingress.kubernetes.io/router.middlewares: traefik-https-redirect@kubernetescrd,traefik-ip-allowlist-internal@kubernetescrd
      - op: add
        path: /spec/rules/0/host
        value: passwords.***REMOVED***
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - passwords.***REMOVED***
            secretName: passwords-home-arpa-tls
    target:
      kind: Ingress
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsGroup
        value: 983
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsUser
        value: 989
    target:
      kind: Deployment
