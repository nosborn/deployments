---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/login
  - resources/persistentvolume.yaml
  - resources/persistentvolumeclaim.yaml

secretGenerator:
  - envs:
      - configs/pocket-id.env
    name: pocket-id-env
    namespace: login

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - login.${DOMAIN_NAME}
    target:
      kind: Certificate
      name: login
      namespace: login
  - patch: |-
      - op: replace
        path: /spec/hostnames
        value:
          - login.${DOMAIN_NAME}
    target:
      kind: HTTPRoute
      name: login
      namespace: login
