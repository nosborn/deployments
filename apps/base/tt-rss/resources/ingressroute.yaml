---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app.kubernetes.io/instance: tt-rss
    app.kubernetes.io/name: tt-rss
  name: tt-rss
  namespace: rss
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`rss.example.com`)
      middlewares:
        - name: ip-allowlist
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: tt-rss
          port: 80
  tls:
    secretName: tt-rss-tls
