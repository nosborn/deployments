---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: rsshub
    app.kubernetes.io/name: rsshub
  name: rsshub
  namespace: rsshub
spec:
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/instance: rsshub
    app.kubernetes.io/name: rsshub
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: rsshub
    app.kubernetes.io/name: rsshub-puppeteer
  name: rsshub-puppeteer
  namespace: rsshub
spec:
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: websocket
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app.kubernetes.io/instance: rsshub
    app.kubernetes.io/name: rsshub-puppeteer
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: rsshub
    app.kubernetes.io/name: rsshub-valkey
  name: rsshub-valkey
  namespace: rsshub
spec:
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: redis
      port: 6379
      targetPort: 6370
  selector:
    app.kubernetes.io/instance: rsshub
    app.kubernetes.io/name: rsshub-valkey
  type: ClusterIP
