---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 1h
  url: https://metallb.github.io/metallb/
---
apiVersion: v1
kind: Namespace
metadata:
  annotations: {}
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
  name: metallb-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  chart:
    spec:
      chart: metallb
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      version: 0.15.3
  install:
    remediation:
      retries: 3
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              - op: replace
                path: /spec/revisionHistoryLimit
                value: 0
            target:
              kind: Deployment
  upgrade:
    crds: CreateReplace
  values:
    controller:
      priorityClassName: system-cluster-critical
      resources:
        requests:
          cpu: 5m
          memory: 37Mi
    networkpolicies:
      enabled: true
    speaker:
      enabled: false
