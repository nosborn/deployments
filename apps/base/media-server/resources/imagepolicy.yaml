---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: lidarr
  namespace: media
spec:
  filterTags:
    extract: $build
    pattern: ^3\.\d+\.\d+\.(?P<build>\d+)$
  imageRepositoryRef:
    name: lidarr
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
