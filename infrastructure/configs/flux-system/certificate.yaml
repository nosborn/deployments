---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hook
  namespace: flux-system
spec:
  dnsNames:
    - flux.osborn.io
  duration: 168h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging # FIXME: letsencrypt
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 8h
  secretName: hook-tls
