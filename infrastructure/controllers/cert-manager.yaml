---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  url: oci://quay.io/jetstack/charts
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/enforce: restricted
  name: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: v1.21.0
  driftDetection:
    ignore:
      - paths:
          - /metadata/annotations
        target:
          annotationSelector: reloader.stakater.com/auto=true
          kind: Deployment
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 1h
  maxHistory: 1
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: add
                path: /metadata/annotations/reloader.stakater.com~1auto
                value: !!str true
            target:
              kind: Deployment
  upgrade:
    crds: CreateReplace
  values:
    cainjector:
      resources:
        requests:
          memory: 32Mi
    config:
      gatewayAPI:
        enabled: true
    crds:
      enabled: true
      keep: true
    enableCertificateOwnerRef: true
    global:
      revisionHistoryLimit: 0
      priorityClassName: system-cluster-critical
    prometheus:
      enabled: false
    resources:
      requests:
        memory: 64Mi
    startupapicheck:
      resources: {}
    webhook:
      resources:
        requests:
          memory: 32Mi
