---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: nzbget
    app.kubernetes.io/instance: media-server
    app.kubernetes.io/name: nzbget
  name: nzbget
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: nzbget
      app.kubernetes.io/instance: media-server
      app.kubernetes.io/name: nzbget
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: nzbget
        app.kubernetes.io/instance: media-server
        app.kubernetes.io/name: nzbget
    spec:
      containers:
        - env:
            - name: LANG
              value: en_GB.UTF-8
          image: ghcr.io/nosborn/nzbget:latest
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command:
                  - /app/nzbget
                  - --configfile=/data/nzbget.conf
                  - --quit
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: http
            timeoutSeconds: 1
          name: nzbget
          ports:
            - containerPort: 6789
              name: http
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: http
            timeoutSeconds: 1
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /app/nzbget.conf
              name: config
              readOnly: true
              subPath: nzbget.conf
            - mountPath: /app/scripts
              name: scripts
            - mountPath: /downloads
              name: downloads
            - mountPath: /library
              name: library
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          secret:
            secretName: nzbget-config
        - name: downloads
          persistentVolumeClaim:
            claimName: nzbget-downloads
        - name: library
          persistentVolumeClaim:
            claimName: media-library
        - emptyDir: {}
          name: scripts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: ombi
    app.kubernetes.io/instance: media-server
    app.kubernetes.io/name: ombi
  name: ombi
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: ombi
      app.kubernetes.io/instance: media-server
      app.kubernetes.io/name: ombi
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: ombi
      labels:
        app.kubernetes.io/component: ombi
        app.kubernetes.io/instance: media-server
        app.kubernetes.io/name: ombi
    spec:
      containers:
        - env:
            - name: LANG
              value: en_GB.UTF-8
          image: ghcr.io/nosborn/ombi:latest
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 10
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: http
            timeoutSeconds: 1
          name: ombi
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: http
            timeoutSeconds: 1
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /tmp
              name: tmp
      initContainers:
        - args:
            - --migrate
          env:
            - name: LANG
              value: en_GB.UTF-8
          image: ghcr.io/nosborn/ombi:latest
          imagePullPolicy: Always
          name: ombi-migrate
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /data
              name: data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ombi-data
        - emptyDir:
            medium: Memory
          name: tmp
---
