---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/vaultwarden
  - resources/persistentvolume.yaml
  - resources/persistentvolumeclaim.yaml
  - resources/secret.yaml

configMapGenerator:
  - behavior: merge
    literals:
      - DOMAIN=https://passwords.***REMOVED***
    name: vaultwarden-env
    namespace: vaultwarden

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - passwords.***REMOVED***
    target:
      kind: Certificate
      name: vaultwarden
      namespace: vaultwarden
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`passwords.***REMOVED***`)
    target:
      kind: IngressRoute
      name: vaultwarden
      namespace: vaultwarden
