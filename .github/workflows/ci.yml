# yamllint disable rule:line-length
---
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: >-
            -ignore-filename-pattern /configs/
            -ignore-filename-pattern /secret.yaml
            -ignore-filename-pattern /secrets/
            -ignore-filename-pattern /values.yaml
            -ignore-missing-schemas
            -output json
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            -strict
            apps/ clusters/ infrastructure/
          entrypoint: /kubeconform

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run yamllint
        run: |
          yamllint --config-file .yamllint --format github --strict .
