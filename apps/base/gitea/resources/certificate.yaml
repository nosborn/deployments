---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitea
  namespace: gitea
spec:
  dnsNames:
    - git.example.com
  duration: 168h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging # FIXME: letsencrypt
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 8h
  secretName: gitea-tls
