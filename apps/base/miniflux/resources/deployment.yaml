---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: miniflux
    app.kubernetes.io/name: miniflux
  name: miniflux
  namespace: miniflux
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: miniflux
      app.kubernetes.io/name: miniflux
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: miniflux
        app.kubernetes.io/name: miniflux
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: miniflux-env
          image: ghcr.io/miniflux/miniflux:2.3.1
          imagePullPolicy: IfNotPresent
          # livenessProbe:
          #   exec:
          #     command:
          #       - /usr/bin/miniflux
          #       - -healthcheck
          #       - auto
          name: miniflux
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          # readinessProbe:
          #   exec:
          #     command:
          #       - /usr/bin/miniflux
          #       - -healthcheck
          #       - auto
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /data
              name: data
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {} # TODO
          name: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: miniflux
    app.kubernetes.io/name: postgres
  name: postgres
  namespace: miniflux
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: miniflux
      app.kubernetes.io/name: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: miniflux
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: postgres-env
          image: postgres:18.4
          imagePullPolicy: IfNotPresent
          # livenessProbe:
          #   exec:
          #     command:
          #       - /usr/bin/miniflux
          #       - -healthcheck
          #       - auto
          name: postgres
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          # readinessProbe:
          #   exec:
          #     command:
          #       - /usr/bin/miniflux
          #       - -healthcheck
          #       - auto
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /tmp
              name: temp
            - mountPath: /var/lib/postgresql
              name: data
            - mountPath: /var/run/postgresql
              name: run
      imagePullSecrets:
        - name: dockerconfig
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {} # TODO
          name: data
        - emptyDir: {}
          name: run
        - emptyDir: {}
          name: temp
