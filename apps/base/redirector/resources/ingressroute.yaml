---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: medium
  namespace: redirector
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`medium.com`) || HostRegexp(`^.+\.medium\.com$`)
      middlewares:
        - name: ip-allowlist
      services:
        - name: redirector
          port: 80
  tls:
    secretName: medium-tls
