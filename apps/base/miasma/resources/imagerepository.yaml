---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: miasma
  namespace: miasma
spec:
  image: ghcr.io/nosborn/miasma
  interval: 1h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: nginx
  namespace: miasma
spec:
  image: docker.io/library/nginx
  interval: 1h
  provider: generic
  secretRef:
    name: dockerconfig
