---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/openclaw
  - resources/persistentvolume.yaml
  - resources/persistentvolumeclaim.yaml

secretGenerator:
  - files:
      - AGENTS.md=secrets/AGENTS.md
      - openclaw.json=secrets/openclaw.json
    name: openclaw-config
    namespace: openclaw

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - claw.home.arpa
    target:
      kind: Certificate
      name: openclaw
      namespace: openclaw
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`claw.home.arpa`)
    target:
      kind: IngressRoute
      name: openclaw
      namespace: openclaw
