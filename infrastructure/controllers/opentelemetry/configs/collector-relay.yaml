---
exporters:
  otlp/uptrace:
    endpoint: https://api.uptrace.dev.:4317
    headers:
      uptrace-dsn: $${env:UPTRACE_DSN}
    tls:
      insecure: false
extensions:
  health_check:
    endpoint: $${env:MY_POD_IP}:13133
processors:
  batch:
    send_batch_size: 10000
    timeout: 30s
  cumulativetodelta: {}
  k8sattributes:
    extract:
      metadata:
        - k8s.deployment.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.replicaset.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
receivers:
  k8s_cluster:
    collection_interval: 60s
  k8sobjects:
    objects:
      - exclude_watch_type:
          - DELETED
        group: events.k8s.io
        mode: watch
        name: events
  otlp:
    protocols:
      grpc:
        endpoint: $${env:MY_POD_IP}:4317
      http:
        endpoint: $${env:MY_POD_IP}:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: opentelemetry-collector
          scrape_interval: 60s
          static_configs:
            - targets:
                - $${env:MY_POD_IP}:8888
service:
  extensions:
    - health_check
  pipelines:
    logs:
      exporters:
        - otlp/uptrace
      processors:
        - memory_limiter
        - k8sattributes
        - batch
      receivers:
        - otlp
        - k8sobjects
    metrics:
      exporters:
        - otlp/uptrace
      processors:
        - memory_limiter
        - cumulativetodelta
        - batch
      receivers:
        - otlp
        - prometheus
        - k8s_cluster
    traces:
      exporters:
        - otlp/uptrace
      processors:
        - memory_limiter
        - k8sattributes
        - batch
      receivers:
        - otlp
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: $${env:MY_POD_IP}
                port: 8888
    resource:
      host.name: $${env:OTEL_K8S_NODE_NAME}
      k8s.namespace.name: $${env:OTEL_K8S_NAMESPACE}
      k8s.node.ip: $${env:OTEL_K8S_NODE_IP}
      k8s.node.name: $${env:OTEL_K8S_NODE_NAME}
      k8s.pod.ip: $${env:OTEL_K8S_POD_IP}
      k8s.pod.name: $${env:OTEL_K8S_POD_NAME}
