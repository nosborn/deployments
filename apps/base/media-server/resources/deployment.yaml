  template:
    metadata:
      labels:
        app.kubernetes.io/component: recyclarr
        app.kubernetes.io/instance: media-server
        app.kubernetes.io/name: recyclarr
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: recyclarr-env
          image: ghcr.io/recyclarr/recyclarr:8.6.0 # {"$imagepolicy": "media:recyclarr"}
          imagePullPolicy: IfNotPresent
          # livenessProbe:
          #   failureThreshold: 3
          #   httpGet:
