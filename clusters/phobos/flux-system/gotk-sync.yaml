---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  ignore: |
    .claude/
    .envrc.example
    .gitattributes
    .github/
    .gitignore
    .pre-commit-config.yaml
    .pre-commit-hooks.d/
    .sops.yaml
    .yamllint
    LICENSE
    README.md
    bootstrap/
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/nosborn/flux-system.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/phobos
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
