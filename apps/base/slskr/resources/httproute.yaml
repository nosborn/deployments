---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slskr-api
  namespace: slskr
spec:
  hostnames:
    - slskr.example.com
  parentRefs:
    - name: gateway
  rules:
    - backendRefs:
        - name: slskr-api
          port: 80
      filters:
        - extensionRef:
            group: traefik.io
            kind: Middleware
            name: ip-allowlist
          type: ExtensionRef
        - extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
          type: ExtensionRef
      matches:
        - path:
            type: PathPrefix
            value: /
