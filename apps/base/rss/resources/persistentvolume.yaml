---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tt-rss-data
  namespace: rss
spec:
  accessModes:
    - ReadWriteOncePod
  capacity:
    storage: 10Gi
  hostPath:
    path: /srv/tt-rss
    type: Directory
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  volumeMode: Filesystem
