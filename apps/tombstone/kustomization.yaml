---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base/gitea
  - ../base/immich
  - ../base/media-server
  - ../base/pds
  - ../base/redirector
  - ../base/searxng
  - ../base/vaultwarden
  - resources/ingressroute.yaml
  - resources/sopssecret.yaml

configMapGenerator:
  - behavior: merge
    envs:
      - configs/gitea-app-ini.env
    name: gitea-app-ini-env
    namespace: gitea
  - behavior: merge
    literals:
      - PDS_HOSTNAME=pds.osborn.io
    name: pds-env
    namespace: pds
  - behavior: merge
    literals:
      - DOMAIN=https://passwords.***REMOVED***
    name: vaultwarden-env
    namespace: vaultwarden

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - git.***REMOVED***
    target:
      kind: Certificate
      name: gitea
      namespace: gitea
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - photos.***REMOVED***
    target:
      kind: Certificate
      name: immich
      namespace: immich
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - lidarr.***REMOVED***
    target:
      kind: Certificate
      name: lidarr
      namespace: media
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - nzbget.***REMOVED***
    target:
      kind: Certificate
      name: nzbget
      namespace: media
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - ombi.***REMOVED***
    target:
      kind: Certificate
      name: ombi
      namespace: media
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - nick.pds.osborn.io
          - pds.osborn.io
    target:
      kind: Certificate
      name: pds
      namespace: pds
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - prowlarr.***REMOVED***
    target:
      kind: Certificate
      name: prowlarr
      namespace: media
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - radarr.***REMOVED***
    target:
      kind: Certificate
      name: radarr
      namespace: media
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - search.***REMOVED***
    target:
      kind: Certificate
      name: searxng
      namespace: searxng
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - sonarr.***REMOVED***
    target:
      kind: Certificate
      name: sonarr
      namespace: media
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - passwords.***REMOVED***
    target:
      kind: Certificate
      name: vaultwarden
      namespace: vaultwarden
  - patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/fsGroup
        value: 981
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsGroup
        value: 981
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsUser
        value: 987
    target:
      kind: CronJob
      namespace: gitea
  - patch: |-
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 981
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 981
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 987
    target:
      kind: Deployment
      name: gitea
      namespace: gitea
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: !!str 1
            memory: 2Gi
    target:
      kind: Deployment
      name: immich-machine-learning
      namespace: immich
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          mountPath: /dev/dri
          name: dri
      - op: add
        path: /spec/template/spec/securityContext/supplementalGroups
        value:
          - 44  # video
          - 105 # render
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          hostPath:
            path: /dev/dri
            type: Directory
          name: dri
    target:
      kind: Deployment
      name: immich-server
      namespace: immich
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TZ
          value: Europe/London
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 996
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 996
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 999
    target:
      kind: Deployment
      namespace: media
  - patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/env/-
        value:
          name: TZ
          value: Europe/London
    target:
      kind: Deployment
      name: ombi
      namespace: media
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SEARXNG_BASE_URL
          value: https://search.***REMOVED***
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TZ
          value: Europe/London
    target:
      kind: Deployment
      name: searxng
      namespace: searxng
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`git.***REMOVED***`)
    target:
      kind: IngressRoute
      name: gitea
      namespace: gitea
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`pds.osborn.io`) || Host(`nick.pds.osborn.io`)
      - op: add
        path: /spec/tls/domains
        value:
          - main: pds.osborn.io
            sans:
              - nick.pds.osborn.io
    target:
      kind: IngressRoute
      name: pds
      namespace: pds
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`photos.***REMOVED***`)
    target:
      kind: IngressRoute
      name: immich
      namespace: immich
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`search.***REMOVED***`)
    target:
      kind: IngressRoute
      name: searxng
      namespace: searxng
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`passwords.***REMOVED***`)
    target:
      kind: IngressRoute
      name: vaultwarden
      namespace: vaultwarden
