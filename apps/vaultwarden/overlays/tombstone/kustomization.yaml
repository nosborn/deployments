---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vaultwarden

resources:
  - ../../base
  - resources/sopssecret.yaml

configMapGenerator:
  - behavior: merge
    literals:
      - DOMAIN=https://passwords.***REMOVED***
    name: vaultwarden

patches:
  - patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/fsGroup
        value: 983
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsGroup
        value: 983
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsUser
        value: 989
    target:
      kind: CronJob
  - patch: |-
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 983
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 983
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 989
    target:
      kind: Deployment
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - passwords.***REMOVED***
    target:
      kind: Certificate
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: "Host(`passwords.***REMOVED***`)"
    target:
      kind: IngressRoute
      name: vaultwarden
