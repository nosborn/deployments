---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app: openclaw
  name: openclaw
  namespace: openclaw
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`claw.example.com`)
      middlewares:
        - name: ip-allowlist
        - name: security-headers
      services:
        - name: openclaw
          port: 80
  tls:
    secretName: openclaw-tls
