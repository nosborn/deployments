---
exclude: ^clusters/.+/flux-system/gotk-components\.yaml$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
        exclude: ^apps/.+/configs/.+\.dockerconfigjson$
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
        exclude: ^apps/.+/configs/.+\.xml$
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^apps/.+/configs/.+\.(dockerconfigjson|xml|conf)$
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: pretty-format-json
        exclude: ^apps/.+/configs/.+\.dockerconfigjson$
      - id: trailing-whitespace
        exclude: ^apps/.+/configs/.+\.(dockerconfigjson|xml|conf)$

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --strict

  - repo: https://github.com/rhysd/actionlint.git
    rev: v1.7.11
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: check-sops-encrypted
        name: check-sops-encrypted
        entry: .pre-commit-hooks.d/check-sops-encrypted.sh
        files: |
          (?x)^(
            apps/base/[^/]+/configs/docker-hub\.dockerconfigjson
            |apps/tombstone/[^/]+/configs/.+
              \.(env|ini|xml|conf|dockerconfigjson)
          )$
        language: script
      - id: kubeconform
        name: kubeconform
        entry: .pre-commit-hooks.d/kubeconform.sh
        exclude: ^.+/(configs/.+|values\.yaml)$
        files: ^(apps|bootstrap|projects)/
        language: script
        types:
          - yaml
