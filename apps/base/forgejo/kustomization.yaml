---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - resources/certificate.yaml
  - resources/cronjob.yaml
  - resources/deployment.yaml
  - resources/ingressroute.yaml
  - resources/namespace.yaml
  - resources/networkpolicy.yaml
  - resources/service.yaml

configMapGenerator:
  - envs:
      - configs/app-ini.env
    name: forgejo-app-ini-env
    namespace: forgejo
  - envs:
      - configs/config.env
    name: forgejo-config-env
    namespace: forgejo
  - files:
      - scripts/configure_forgejo.sh
      - scripts/configure_gpg_environment.sh
      - scripts/init_directory_structure.sh
    name: forgejo-init
    namespace: forgejo
