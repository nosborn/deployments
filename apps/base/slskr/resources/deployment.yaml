---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: slskr-api
  name: slskr-api
  namespace: slskr
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: slskr-api
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: slskr-api
      labels:
        app: slskr-api
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: slskr-config
            - secretRef:
                name: slskr-secrets
          name: slskr-api
          image: ghcr.io/snapetech/slskr:v0.2.38
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          ports:
            - containerPort: 5030
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /tmp
              name: cache
      imagePullSecrets:
        - name: dockerconfig
      # local-path creates /data as root:root 0777, and slskr exits if it can't
      # chmod its state dir. Create a subdir as uid 1000 instead: slskr owns it,
      # so the chmod succeeds without needing root (which "restricted" forbids).
      initContainers:
        - command:
            - mkdir
            - -p
            - /data/state
          image: busybox:1.37
          name: mkdir-state
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /data
              name: data
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: slskr
      volumes:
        - emptyDir: {}
          name: cache
        - name: data
          persistentVolumeClaim:
            claimName: slskr-data
