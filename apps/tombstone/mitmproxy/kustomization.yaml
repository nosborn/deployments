---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/mitmproxy

secretGenerator:
  - behavior: merge
    files:
      - configs/config.yaml
    name: mitmproxy
    namespace: mitmproxy

patches:
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`mitmproxy.home.arpa`)
    target:
      kind: IngressRoute
      name: mitmproxy-web
      namespace: mitmproxy
