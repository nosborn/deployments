---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/name: forgejo-data
  name: forgejo-data
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 100Gi
  claimRef:
    name: forgejo-data
    namespace: forgejo
  iscsi:
    fsType: btrfs
    iqn: iqn.2000-01.com.synology:diskstation.default-target.8f20388e135
    lun: 2
    targetPortal: 192.168.1.3:3260
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
