---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/name: gitea
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: gitea
      app.kubernetes.io/name: gitea
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: gitea
      labels:
        app.kubernetes.io/instance: gitea
        app.kubernetes.io/name: gitea
    spec:
      containers:
        - args:
            - web
          command:
            - /usr/local/bin/gitea
          env:
            - name: GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES
              value: 127.0.0.0/8,::1/128
          image: docker.gitea.com/gitea:1.26.4-rootless
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 200
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          name: gitea
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 26m
              memory: 126Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/gitea/app.ini
              name: config
              subPath: app.ini
            - mountPath: /var/lib/gitea
              name: data
            - mountPath: /tmp/gitea
              name: temp
      initContainers:
        - env:
            # - name: COOKIE_DYNAMIC_DOMAIN
            #   value: !!str true
            - name: COOKIE_HTTP_ONLY
              value: !!str true
            - name: COOKIE_SAME_SITE
              value: Strict
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  key: ED25519_PRIVATE_KEY_HEX
                  name: anubis-key
            - name: SERVE_ROBOTS_TXT
              value: !!str true
            - name: TARGET
              value: http://localhost:3000
          image: ghcr.io/techarohq/anubis:v1.25.0
          imagePullPolicy: IfNotPresent
          name: anubis
          ports:
            - containerPort: 8923
              name: http-anubis
          restartPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          secret:
            secretName: gitea-config
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
        - emptyDir:
            medium: Memory
            # sizeLimit: TODO
          name: temp
